# Runs the tests on Linux, as root and with Docker, so that the tests that
# create device nodes or start a throwaway container are not skipped. A second
# job sets Daniel up for real on a throwaway machine, with a stand-in for the
# official tool, and checks the whole chain.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests
        run: sudo python3 -m unittest discover -v tests

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Daniel up on this machine and check the whole chain
        run: sudo CI=true bash tests/system_test.sh
